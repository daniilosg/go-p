server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index home.html index.html;

    location / {
        try_files $uri $uri/ /home.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
